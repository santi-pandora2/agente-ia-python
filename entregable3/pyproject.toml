[project]
name = "entregable3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "santiago rojas rodríguez", email = "santiagorojas772@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# openpyxl deja abierto el ZipFile del .xlsm y Python lo reporta al recolectar.
filterwarnings = ["ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning"]

[tool.uv]
# Proyecto sin paquete: el código vive en scripts/ y se ejecuta como script,
# no se importa como librería. uv solo gestiona el entorno y las dependencias.
package = false
